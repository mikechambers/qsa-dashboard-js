[package]
name = "qsa-dashboard"
version = "0.85.0"
description = "QSA Dashboard"
authors = ["Mike Chambers"]
license = "MIT"
repository = "https://github.com/mikechambers/qsa-dashboard-js"
edition = "2024"
rust-version = "1.90"
# not for crates.io
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "6"
